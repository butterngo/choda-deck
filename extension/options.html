<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 460px; margin: 24px auto; padding: 0 16px; }
      h1 { font-size: 16px; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border-radius: 6px; border: 1px solid #8884; background: #8881; color: inherit; }
      button { margin-top: 16px; padding: 8px 16px; font: inherit; font-weight: 600; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
      p.hint { color: #8889; font-size: 12px; margin: 4px 0 0; }
      #saved { margin-left: 10px; color: #16a34a; }
      code { background: #8882; padding: 1px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Choda Capture — settings</h1>

    <label for="base">Bridge URL</label>
    <input id="base" placeholder="http://127.0.0.1:7338" />
    <p class="hint">Where <code>companion-server</code> listens. Default port 7338.</p>

    <label for="token">Bridge token</label>
    <input id="token" placeholder="paste contents of data/bridge-token.txt" />
    <p class="hint">Found at <code>&lt;CHODA_DATA_DIR&gt;/bridge-token.txt</code>, printed on server boot.</p>

    <div>
      <button id="save">Save</button><span id="saved"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
