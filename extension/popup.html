<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px/1.4 system-ui, sans-serif;
        /* Runs as the side panel page (full browser height, user-resizable
           width) — fluid, with a floor for readability. */
        min-width: 420px;
        margin: 0;
        padding: 14px;
      }
      h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
      label { display: block; margin: 8px 0 3px; font-weight: 500; }
      select, textarea, button, input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #8884;
        background: #8881;
        color: inherit;
      }
      textarea { min-height: 90px; resize: vertical; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .modes { display: flex; gap: 12px; margin: 4px 0; }
      .modes label { display: inline-flex; align-items: center; gap: 4px; margin: 0; font-weight: 400; }
      .modes input { width: auto; }
      button.primary { margin-top: 10px; background: #2563eb; color: #fff; border: none; cursor: pointer; padding: 8px; font-weight: 600; }
      button.ghost { cursor: pointer; }
      /* TASK-1457/1458 — screenshot toolbar + canvas (paste-from-clipboard, highlighter markup). */
      .shotToolbar { display: flex; gap: 6px; }
      .shotToolbar button { width: auto; flex: none; padding: 6px 10px; }
      #shotCanvas {
        max-width: 100%; margin-top: 6px; border-radius: 6px; display: block;
        cursor: crosshair; border: 1px solid #8883;
      }
      #reqPreview {
        /* Roomier than the old flat pane — Headers now stacks General + both
           header sections, and DevTools-style reading wants the vertical space. */
        max-height: 40vh;
        overflow: auto;
        margin: 6px 0 0;
        padding: 6px 8px;
        background: #8881;
        border-radius: 6px;
        font: 11px/1.35 ui-monospace, "Cascadia Code", monospace;
        word-break: break-all;
      }
      #reqPreview:empty { display: none; }
      .hdrSummary { font-weight: 600; margin-bottom: 6px; white-space: pre-wrap; }
      .hdrCopy {
        width: auto; flex: none; padding: 1px 6px; font-size: 10px; cursor: pointer;
        border-radius: 4px; border: 1px solid #8884; background: #8881;
      }
      .hdrCopy:disabled { opacity: 0.4; cursor: default; }
      .bodyPre { margin: 0; white-space: pre-wrap; word-break: break-all; font: inherit; }
      /* One filter bar — search + method + status + refresh. Consolidates the
         TASK-1454 search/refresh row with the TASK-1455 method/status row: every
         control shares a height so the strip reads as one, and it wraps rather
         than squashing when the side panel is narrow. */
      .netToolbar {
        display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0 4px;
      }
      .netToolbar > * { height: 26px; margin: 0; box-sizing: border-box; }
      .netToolbar input {
        flex: 1 1 140px; min-width: 110px; padding: 0 8px; font-size: 12px;
      }
      .netToolbar select { flex: 0 1 auto; padding: 0 4px; font-size: 11px; }
      .netToolbar button { width: auto; flex: none; padding: 0 9px; cursor: pointer; }
      .chips { display: flex; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
      .chips button {
        width: auto; height: 22px; padding: 0 9px; font-size: 11px; cursor: pointer;
        border-radius: 999px; border: 1px solid #8884; background: #8881;
      }
      .chips button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
      .selectall { font-weight: 400; font-size: 12px; display: flex; align-items: center; gap: 6px; margin: 6px 0 2px; }
      .selectall input { width: auto; }
      /* TASK-1452 — DevTools-Network-tab-style table: checkbox / name / method / status / type columns. */
      .reqTableHead, .reqRow {
        display: grid; grid-template-columns: 22px 1fr 62px 52px 56px; gap: 8px; align-items: center;
      }
      .reqTableHead {
        padding: 5px 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.03em;
        text-transform: uppercase; opacity: 0.6; border: 1px solid #8883; border-bottom: none;
        border-radius: 6px 6px 0 0;
      }
      #reqList {
        max-height: 46vh; overflow: auto; margin-top: 0; border: 1px solid #8883; border-top: none;
        border-radius: 0 0 6px 6px;
      }
      .reqGroup { border-bottom: 1px solid #8882; }
      .reqGroup:last-child { border-bottom: none; }
      .reqGroupHeader {
        font-size: 11px; font-weight: 600; padding: 5px 8px; cursor: pointer;
        user-select: none; background: #8881;
      }
      .reqGroupHeader:hover { background: #8882; }
      .reqRow {
        padding: 5px 8px; font-size: 12px; font-family: ui-monospace, "Cascadia Code", monospace;
        cursor: pointer;
      }
      .reqRow:hover { background: #8882; }
      .reqRow.active { background: #2563eb22; }
      .reqRow input { width: auto; margin: 0; }
      .reqName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .reqMethod, .reqStatus, .reqType { font-size: 11px; opacity: 0.8; }
      /* Detail-pane tabs (Headers / Payload / Preview / Response / Cookies),
         replacing TASK-1453's header dropdown (copy now lives per tab). */
      .detailTabs {
        display: flex; gap: 2px; margin: 6px 0 0; border-bottom: 1px solid #8883;
      }
      .detailTabs button {
        width: auto; flex: none; padding: 5px 10px; font-size: 11px; cursor: pointer;
        border: none; background: none; opacity: 0.65; border-bottom: 2px solid transparent;
      }
      .detailTabs button:hover { opacity: 0.9; }
      .detailTabs button.active { opacity: 1; font-weight: 600; border-bottom-color: #2563eb; }
      .detailActions { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 4px; }
      .detailTabs .tabClose {
        padding: 5px 8px; opacity: 0.5; border-bottom-color: transparent; font-size: 12px;
      }
      .detailTabs .tabClose:hover { opacity: 1; }
      .detailSection { margin-top: 8px; }
      .sectionHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .sectionToggle {
        width: auto; flex: 1; text-align: left; padding: 2px 0; font: inherit; font-weight: 600;
        opacity: 0.75; border: none; background: none; cursor: pointer; user-select: none;
      }
      .rawToggle {
        display: flex; align-items: center; gap: 4px; font-weight: 400; font-size: 11px;
        opacity: 0.7; white-space: nowrap;
      }
      .rawToggle input { width: auto; margin: 0; }
      /* Name column sized to fit, value column wraps — long tokens can't push the
         names out of alignment. */
      .kvRow { display: grid; grid-template-columns: minmax(90px, 34%) 1fr; gap: 8px; padding: 1px 0; }
      .kvName { opacity: 0.7; word-break: break-word; }
      .kvValue { word-break: break-all; white-space: pre-wrap; }
      .kvEmpty { opacity: 0.55; padding: 1px 0; }
      #status { margin-top: 10px; min-height: 16px; font-size: 12px; }
      #status.ok { color: #16a34a; }
      #status.err { color: #dc2626; }
      a { color: #2563eb; }
    </style>
  </head>
  <body>
    <h1>Choda Capture</h1>

    <div id="discoveryPane" style="border:1px solid #8884;border-radius:6px;padding:8px;margin-bottom:10px">
      <button type="button" id="recBtn" class="ghost">● Record discovery</button>
      <div id="recStatus" style="font-size:12px;margin-top:4px"></div>
    </div>

    <div class="modes">
      <label><input type="radio" name="kind" value="text" checked /> Text</label>
      <label><input type="radio" name="kind" value="image" /> Screenshot</label>
      <label><input type="radio" name="kind" value="network" /> Network</label>
    </div>

    <div class="row">
      <div>
        <label for="project">Project</label>
        <select id="project"></select>
      </div>
      <div>
        <label for="destination">Destination</label>
        <select id="destination"></select>
      </div>
    </div>

    <div id="convPane" hidden>
      <label for="convTarget">Conversation</label>
      <select id="convTarget"></select>
    </div>

    <div id="knowledgeTypePane" hidden>
      <label for="knowledgeType">Knowledge type</label>
      <select id="knowledgeType">
        <option value="learning" selected>learning</option>
        <option value="spike">spike</option>
        <option value="decision">decision</option>
        <option value="postmortem">postmortem</option>
        <option value="evaluation">evaluation</option>
        <option value="feature">feature</option>
        <option value="code_ref">code_ref</option>
        <option value="gotcha">gotcha</option>
      </select>
    </div>

    <div id="textPane">
      <label for="text">Text (edit before sending)</label>
      <button type="button" id="grabText" class="ghost">📄 Grab page text</button>
      <textarea id="text" placeholder="Select text on the page, or type here…"></textarea>
    </div>

    <div id="imagePane" hidden>
      <div class="shotToolbar">
        <button type="button" id="grab" class="ghost">📸 Grab visible tab</button>
        <button type="button" id="shotClear" class="ghost" hidden>✕ Clear markup</button>
        <button type="button" id="shotRemove" class="ghost" hidden>🗑 Remove image</button>
      </div>
      <p class="hint" style="margin:4px 0 0">
        Or paste an image from your clipboard (Ctrl+V). Drag on the image to highlight.
      </p>
      <canvas id="shotCanvas" hidden></canvas>
    </div>

    <div id="networkPane" hidden>
      <label>Recent requests (this tab)</label>
      <div id="typeChips" class="chips"></div>
      <div class="netToolbar">
        <input type="text" id="reqSearch" placeholder="search URL or response body…" />
        <select id="methodFilter"><option value="all">All methods</option></select>
        <select id="statusFilter"><option value="all">All statuses</option></select>
        <button type="button" id="reqRefresh" class="ghost" title="Re-read this tab's requests">⟳</button>
      </div>
      <label class="selectall"><input type="checkbox" id="selectAll" /> select all (filtered)</label>
      <div class="reqTableHead">
        <span></span><span>Name</span><span>Method</span><span>Status</span><span>Type</span>
      </div>
      <div id="reqList"></div>
      <div id="reqTabs" class="detailTabs" hidden></div>
      <div id="reqPreview"></div>
      <p class="hint" style="margin:4px 0 0">Headers + cookies + token + request/response bodies (fetch/XHR; reload page to capture).</p>
    </div>

    <button type="button" id="send" class="primary">Capture →</button>
    <div id="status">
      <span id="hint"></span>
    </div>

    <script src="lib/timeline.js"></script>
    <script src="lib/curl.js"></script>
    <script src="lib/reqfilter.js"></script>
    <script src="lib/netview.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
